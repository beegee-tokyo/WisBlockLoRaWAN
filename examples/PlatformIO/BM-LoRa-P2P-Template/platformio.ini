[platformio]
default_envs = 
	; rak4630
	rak3112
	; rak3400
	rak11300
boards_dir = rakwireless/boards

[env:rak4630]
platform = nordicnrf52
board = rak4630
framework = arduino
; Pulls in the extra .cpp files (e.g. variant.cpp) from the patch's variant folder
build_src_filter =
    ${env.build_src_filter}
    +<../rakwireless/variants/rak4630>
build_flags =
    ; -D CFG_DEBUG=0
    ; Needed so variant.h / pins for the RAK4630/RAK4631 are found
    -I rakwireless/variants/rak4630
	; -D WISBLOCK_RADIO_HAL_KEEP_ANT_PWR_ALWAYS_ON=1
	; -D WISBLOCK_RADIO_HAL_DEBUG=1
	-D MODEM_HAL_DBG_TRACE=0
	-D MY_DEBUG=1
; Serial monitor
monitor_speed = 115200
; Give the board time to enumerate its USB serial port before uploading
upload_speed = 115200
lib_deps =
   https://github.com/beegee-tokyo/WisBlockLoRaWAN
   electroniccats/CayenneLPP
   paulstoffregen/Time

[env:rak3400]
platform = nordicnrf52
board = rak3400
framework = arduino
; Pulls in the extra .cpp files (e.g. variant.cpp) from the patch's variant folder
build_src_filter =
    ${env.build_src_filter}
    +<../rakwireless/variants/rak3400>
build_flags =
    ; -D CFG_DEBUG=0
    ; Needed so variant.h / pins for the RAK3400/RAK3401 are found
    -I rakwireless/variants/rak3400
	; -D WISBLOCK_RADIO_HAL_KEEP_ANT_PWR_ALWAYS_ON=1
	; -D WISBLOCK_RADIO_HAL_DEBUG=1
	-D MODEM_HAL_DBG_TRACE=0
; Serial monitor
monitor_speed = 115200
; Give the board time to enumerate its USB serial port before uploading
upload_speed = 115200
lib_deps =
   https://github.com/beegee-tokyo/WisBlockLoRaWAN
   electroniccats/CayenneLPP
   paulstoffregen/Time

[env:rak3112]
platform = espressif32
board = rak3112
framework = arduino
; Pulls in the extra .cpp files (e.g. variant.cpp) from the patch's variant folder
build_src_filter =
    ${env.build_src_filter}
    +<../rakwireless/variants/rak3112>
build_flags =
    ; -DCFG_DEBUG=0
    ; Needed so variant.h / pins for the RAK3112/RAK3312 are found
    -I rakwireless/variants/rak3112
	-D MODEM_HAL_DBG_TRACE=0
	-D MY_DEBUG=1
; Serial monitor
monitor_speed = 115200
monitor_filters = colorize, esp32_exception_decoder
; Give the board time to enumerate its USB serial port before uploading
upload_speed = 115200
lib_deps =
   https://github.com/beegee-tokyo/WisBlockLoRaWAN
   electroniccats/CayenneLPP
   paulstoffregen/Time
lib_ldf_mode = deep+

[env:rak11300]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rakwireless_rak11300
framework = arduino
board_build.filesystem = littlefs
board_build.filesystem_size = 0.5m
build_flags = 
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
	-D HEARTH_SERIAL_PORT=Serial1 ; Not sure why this is needed :-(
	-D ARDUINO_ARCH_RP2040
	-D MODEM_HAL_DBG_TRACE=0
	-D MY_DEBUG=1
lib_deps =
   https://github.com/beegee-tokyo/WisBlockLoRaWAN
   electroniccats/CayenneLPP
   paulstoffregen/Time
